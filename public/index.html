<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Herd Yard - Zillow For Cattle</title>
    <meta name="description" content="Herd Yard is an online platform for selling cattle. Connecting buyers and sellers nationwide." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600;650&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/styles.css?v=12" />
    <link rel="stylesheet" href="css/mobile.css?v=12" />
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="#/">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M16 3c6 8 11 13 11 18a11 11 0 1 1-22 0c0-5 5-10 11-18z" fill="#1b6b45"/>
          <circle cx="16" cy="20" r="4.2" fill="#f4f1ea"/>
        </svg>
        Herd Yard
      </a>
      <nav class="nav-links">
        <a href="#/browse">Browse</a>
        <a href="#/pricing">Plans</a>
        <a href="#/faq">FAQ</a>
        <a href="#/list">Sell</a>
        <a href="#/account">Account</a>
      </nav>
      <div class="header-actions">
        <button class="btn btn-ghost" id="acct-btn"><span id="acct-label">Log in</span></button>
        <button class="btn btn-primary" id="sell-btn">List Cattle</button>
      </div>
    </header>
    <main id="app"></main>
    <footer class="app-footer">
      <div><b>Herd Yard</b><div>Selling cattle online. Connecting buyers and sellers nationwide.</div></div>
      <div>Photos stored with each listing. Map (c) OpenStreetMap.</div>
    </footer>
    <div class="toast" id="toast"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/data.js?v=12"></script>
    <script src="js/client.js?v=12"></script>
    <script src="js/photos.js?v=12"></script>
    <script src="js/dashboard.js?v=12"></script>
    <script src="js/ranch-public.js?v=12"></script>
    <script src="js/cover-label.js?v=12"></script>
    <script>
      (function () {
        function fix() {
          var h = document.querySelector(".hero h1");
          if (h) h.textContent = "Zillow For Cattle";
          var a = document.getElementById("acct-label");
          if (a && (a.textContent === "Account")) a.textContent = "Log in";
        }
        window.addEventListener("hashchange", function () { setTimeout(fix, 30); });
        setTimeout(fix, 50);
        setTimeout(fix, 400);
      })();
    </script>
  </body>
</html>
