<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Herd Yard - Zillow For Cattle</title>
    <meta name="description" content="Herd Yard is an online platform for selling cattle. Connecting buyers and sellers nationwide. No commission on private-treaty cattle." />
    <link rel="canonical" href="https://herd-yard.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Herd Yard" />
    <meta property="og:title" content="Herd Yard — Zillow For Cattle" />
    <meta property="og:description" content="Connecting buyers and sellers nationwide. No commission on private-treaty cattle." />
    <meta property="og:url" content="https://herd-yard.com/" />
    <meta property="og:image" content="https://herd-yard.com/og.jpg" />
    <meta property="og:image:secure_url" content="https://herd-yard.com/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Herd Yard hero: Zillow For Cattle" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Herd Yard — Zillow For Cattle" />
    <meta name="twitter:description" content="Connecting buyers and sellers nationwide. No commission on private-treaty cattle." />
    <meta name="twitter:image" content="https://herd-yard.com/og.jpg" />
    <link rel="image_src" href="https://herd-yard.com/og.jpg" />
    <link rel="icon" type="image/svg+xml" href="logo.svg?v=50" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600;650&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/styles.css?v=50" />
    <link rel="stylesheet" href="css/mobile.css?v=50" />
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="#/">
        <img src="logo.svg?v=50" alt="Herd Yard" width="36" height="50" style="display:block;object-fit:contain;background:transparent" />
        Herd Yard
      </a>
      <nav class="nav-links">
        <a href="#/browse">Browse</a>
        <a href="#/producers">Producers</a>
        <a href="#/pricing">Plans</a>
        <a href="#/faq">FAQ</a>
        <a href="#/list">Sell</a>
        <a href="#/account">Account</a>
      </nav>
      <div class="header-actions">
        <button class="btn btn-ghost" id="acct-btn"><span id="acct-label">Log in</span></button>
        <button class="btn btn-primary" id="sell-btn">List Cattle</button>
      </div>
    </header>
    <main id="app"></main>
    <footer class="app-footer">
      <div><b>Herd Yard</b><div>Selling cattle online. Connecting buyers and sellers nationwide.</div></div>
      <div>Map tiles Esri / OpenStreetMap.<div class="site-version">v0.4.8</div></div>
    </footer>
    <div class="toast" id="toast"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/data.js?v=50"></script>
    <script src="js/client.js?v=50"></script>
    <script src="js/photos.js?v=50"></script>
    <script src="js/dashboard.js?v=50"></script>
    <script src="js/listings-manage.js?v=50"></script>
    <script src="js/admin-producers.js?v=50"></script>
    <script src="js/ranch-public.js?v=50"></script>
    <script src="js/cover-label.js?v=50"></script>
    <script src="js/producers-page.js?v=50"></script>
    <script src="js/updates-page.js?v=50"></script>
    <script>
      (function () {
        function toTop() {
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          document.body.scrollTop = 0;
          var app = document.getElementById("app");
          if (app) app.scrollTop = 0;
        }
        function fix() {
          var h = document.querySelector(".hero h1");
          if (h) h.textContent = "Zillow For Cattle";
          var a = document.getElementById("acct-label");
          if (a && (a.textContent === "Account")) a.textContent = "Log in";
        }
        window.addEventListener("hashchange", function () {
          toTop();
          setTimeout(toTop, 30);
          setTimeout(toTop, 200);
          setTimeout(fix, 30);
        });
        setTimeout(fix, 50);
        setTimeout(fix, 400);
      })();
    </script>
  </body>
</html>
